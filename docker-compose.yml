# Entorno local idéntico a producción: PostgreSQL + pgvector y la app con Tesseract.
#   docker compose up --build      → http://localhost:8000  (usuario admin, clave de ADMIN_PASSWORD)
# Lee las claves de IA de .env (GEMINI_API_KEY, GROQ_API_KEY).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: local
      POSTGRES_DB: gd
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "gd"]
      interval: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:local@db:5432/gd
      ALLOWED_ORIGINS: http://localhost:8000
      SCHEDULER_ENABLED: "true"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
